name: studentkit
description: All-in-one student utility app for Pakistani students
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Database
  sqflite: ^2.3.0
  path: ^1.8.3
  # State Management
  provider: ^6.1.1
  # PDF Generation
  pdf: ^3.10.7
  printing: ^5.11.1
  # File & Image Handling
  image_picker: ^1.0.7
  file_picker: ^6.1.1
  image: ^4.1.3
  image_cropper: ^5.0.1
  # Excel
  excel: ^4.0.2
  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.6
  # Sharing & Storage
  share_plus: ^7.2.2
  path_provider: ^2.1.2
  flutter_secure_storage: ^9.0.0
  # UI & Charts
  fl_chart: ^0.66.2
  flutter_local_notifications: ^16.3.2
  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3
  permission_handler: ^11.3.0
  local_auth: ^2.1.8
  cunning_document_scanner: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
